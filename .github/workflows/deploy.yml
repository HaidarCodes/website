name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build branded image
        env:
          PUBLIC_SITE_NAME: ${{ secrets.PUBLIC_SITE_NAME }}
          PUBLIC_CONTACT_EMAIL: ${{ secrets.PUBLIC_CONTACT_EMAIL }}
        run: |
          test -n "$PUBLIC_SITE_NAME"
          test -n "$PUBLIC_CONTACT_EMAIL"
          export DOCKER_BUILDKIT=1
          docker build --pull --no-cache \
            --secret id=public_site_name,env=PUBLIC_SITE_NAME \
            --secret id=public_contact_email,env=PUBLIC_CONTACT_EMAIL \
            -t static-portal-site:local .

      - name: Start new container
        run: docker compose up -d --force-recreate --remove-orphans --wait --wait-timeout 60

      - name: Verify container
        run: docker compose ps --status running --services website | grep -Fxq website
